[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# 網址裡帶著場次代碼（等於看名單的鑰匙），不能讓它跟著 Referer 跑到
# Google Fonts、jsdelivr 這些外部主機去。
[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"

# 把 /api/xxx 轉到對應的 serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# 學員簽到頁：/s/課程代碼  → 顯示 checkin.html（網址保持不變）
[[redirects]]
  from = "/s/*"
  to = "/checkin.html"
  status = 200

# 投影牆：/wall/課程代碼 → 顯示 wall.html
[[redirects]]
  from = "/wall/*"
  to = "/wall.html"
  status = 200

# 角落即時模式：/ticker/課程代碼 → 顯示 ticker.html
[[redirects]]
  from = "/ticker/*"
  to = "/ticker.html"
  status = 200
