<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>角落即時牆</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Serif+TC:wght@400;600;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/brand.css">
  <style>
    /* 角落模式：細長條，可常駐小視窗，或當 OBS 透明 browser source */
    html, body { height: 100%; }
    body { padding: 12px; overflow: hidden; }
    body.transparent { background: transparent; }
    .panel { height: 100%; display: flex; flex-direction: column; }
    .bar { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; margin-bottom: 8px;
      background: var(--ink); color: var(--paper); }
    .bar .t { font-family: var(--mono); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; }
    .bar .t .dot { color: var(--coral); }
    .bar .n { font-family: var(--display); font-weight: 700; font-size: 18px; }
    .list { display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
    .card { background: var(--paper2); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); padding: 9px 11px; animation: slide .4s ease; }
    @keyframes slide { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
    .card .nm { font-family: var(--mono); font-weight: 700; font-size: 12px; letter-spacing: .5px; text-transform: uppercase; }
    .card .nm .v { color: var(--coral); float: right; }
    .card .ms { font-family: var(--serif); font-size: 15px; line-height: 1.4; margin-top: 3px; word-break: break-word;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card.ans { border-color: var(--sage); opacity: .65; }
    .empty { font-family: var(--display); font-style: italic; color: var(--muted); padding: 14px 4px; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="bar"><span class="t"><span class="dot">●</span> LIVE <span id="mode"></span></span><span class="n" id="count">0</span></div>
    <div class="list" id="list"></div>
  </div>

  <script>
    const slug = decodeURIComponent((location.pathname.split("/ticker/")[1] || "")).replace(/\/+$/,"");
    const params = new URLSearchParams(location.search);
    if (params.get("transparent") === "1" || params.get("bg") === "transparent") document.body.classList.add("transparent");
    const limit = parseInt(params.get("limit") || "6", 10);
    const list = document.getElementById("list");
    let SESSION = null;
    const MODE_LABEL = { checkin: "簽到", message: "留言", qa: "Q&A" };

    async function loadSession() {
      try { const r = await fetch(`/api/session?slug=${encodeURIComponent(slug)}`);
        if (r.ok) { SESSION = await r.json(); document.getElementById("mode").textContent = "· " + (MODE_LABEL[SESSION.mode]||""); } } catch {}
    }

    async function refresh() {
      if (!SESSION) return;
      try {
        const data = await (await fetch(`/api/list?slug=${encodeURIComponent(slug)}`)).json();
        document.getElementById("count").textContent = data.count;
        if (data.count === 0) { list.innerHTML = `<div class="mascot-box" style="padding:10px 0"><img src="/mascot.svg" alt="" style="width:64px"><div class="bubble" style="font-size:12px">等待第一筆…</div></div>`; return; }
        let items = data.entries.slice();
        if (SESSION.mode === "qa") items.sort((a,b) => (b.votes||0)-(a.votes||0) || b.at-a.at);
        else items.reverse();
        items = items.slice(0, limit);
        list.innerHTML = items.map(e => `
          <div class="card ${e.answered?"ans":""}">
            <div class="nm">${escapeHtml(e.name)}${SESSION.mode==="qa"?`<span class="v">❤️ ${e.votes||0}</span>`:(SESSION.mode==="message"&&(e.votes||0)>0?`<span class="v">❤️ ${e.votes}</span>`:"")}</div>
            ${e.message ? `<div class="ms">${escapeHtml(e.message)}${e.emoji?" "+e.emoji:""}</div>` : (e.emoji?`<div class="ms">${e.emoji}</div>`:"")}
          </div>`).join("");
      } catch {}
    }

    function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

    if (!slug) list.innerHTML = `<div class="empty">缺少代碼</div>`;
    else { loadSession().then(() => { refresh(); setInterval(refresh, 2000); }); }
  </script>
</body>
</html>
