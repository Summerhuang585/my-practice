<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>老師後台 · 簽到牆</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Serif+TC:wght@400;600;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/brand.css">
  <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@04f46c6a/qrcode.min.js"></script>
  <style>
    .wrap { max-width: 780px; margin: 0 auto; padding: 30px 22px 60px; }
    h1.page { font-family: var(--display); font-weight: 900; font-size: 40px; margin: 4px 0 22px; border-bottom: 2px solid var(--ink); padding-bottom: 12px; }
    h2 { font-family: var(--display); font-weight: 700; font-size: 22px; margin-top: 0; }
    .card { background: var(--paper2); border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); padding: 22px; margin-bottom: 24px; }
    .modes { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 6px 0 4px; }
    .modes label { display: block; border: 3px solid var(--ink); padding: 12px; cursor: pointer; background: #fff; }
    .modes label.on { border-color: var(--coral); background: #fbe7e4; box-shadow: 4px 4px 0 var(--coral); }
    .modes .mt { font-family: var(--mono); font-weight: 700; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
    .modes .md { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
    .modes input { display: none; }
    .opt { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 15px; }
    .links div { margin: 10px 0; font-size: 14px; }
    .links a { color: var(--coral); word-break: break-all; font-family: var(--mono); font-size: 13px; }
    .qrbox { text-align: center; margin: 18px 0; }
    .qrbox #qrcode { display: inline-block; padding: 10px; background: #fff; border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); }
    .muted { color: var(--muted); font-size: 13px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th { font-family: var(--mono); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); text-align: left; }
    th, td { padding: 9px 6px; border-bottom: 1px solid var(--rule); font-size: 14px; vertical-align: top; }
    .saved-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rule); gap: 8px; }
    .saved-item a { color: var(--ink); text-decoration: none; font-family: var(--display); font-size: 17px; }
    .hide { display: none; }
    .pill { display:inline-block; background:var(--pink); color:#fff; padding:3px 9px; font-size:11px; font-family: var(--mono); letter-spacing: 1px; }
    .small { padding: 6px 12px; font-size: 11px; }
    .rowbtns { display: flex; gap: 6px; flex-wrap: wrap; }
    .hint-note { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 6px; min-height: 16px; }
    .hint-note b { color: var(--coral); }
    .btn.ghost.danger { color: var(--coral); border-color: var(--coral); }
    .btn.ghost.danger:hover { background: var(--coral); color: #fff; }
    .tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .tablewrap table { min-width: 460px; }
    @media (max-width: 560px) {
      .wrap { padding: 22px 15px 50px; }
      h1.page { font-size: 28px; }
      .modes { grid-template-columns: 1fr; }
      .saved-item { flex-direction: column; align-items: flex-start; }
      .links a { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="kicker" style="border-top:2px solid var(--ink)"><span class="live">SUMMER'S LAB</span><span>CHECK·IN WALL · ADMIN</span></div>
    <h1 class="page">簽到牆 — 老師後台</h1>

    <div class="card">
      <h2>建立新場次</h2>
      <label class="flabel">名稱</label>
      <div class="field"><input id="title" type="text" maxlength="60" placeholder="例如：AI 工作坊 第 3 場" /></div>
      <label class="flabel">自訂代碼（選填，留空會自動產生）</label>
      <div class="field"><input id="code" type="text" maxlength="24" placeholder="只限英數與 -（中文／空格會被略過），例如：ai-0613" /></div>
      <div class="hint-note" id="codeHint"></div>
      <p class="muted" style="margin:6px 0 0">系統會在代碼後面加一組隨機字元。代碼等於看名單的鑰匙，加了才不會被人試出來。</p>

      <label class="flabel" style="margin-top:18px">模式</label>
      <div class="modes" id="modes">
        <label data-mode="checkin" class="on"><input type="radio" name="mode" value="checkin" checked />
          <div class="mt">🟢 簽到</div><div class="md">實名・防同名・可匯出名單</div></label>
        <label data-mode="message"><input type="radio" name="mode" value="message" />
          <div class="mt">💬 留言</div><div class="md">打招呼・可匿名・可加 emoji</div></label>
        <label data-mode="qa"><input type="radio" name="mode" value="qa" />
          <div class="mt">❓ Q&A</div><div class="md">提問・可匿名・按讚排序・標記已回答</div></label>
      </div>

      <div class="opt hide" id="optAnon"><input id="allowAnonymous" type="checkbox" /> <span>允許匿名（學員可不填名字）</span></div>
      <div class="opt hide" id="optEmoji"><input id="allowEmoji" type="checkbox" checked /> <span>允許學員選 emoji 心情</span></div>

      <div style="margin-top:20px"><button class="btn" id="create">建立場次</button></div>
      <div id="createErr" class="err" style="margin-top:8px"></div>
    </div>

    <div id="result" class="card hide">
      <h2>✅ 已建立：<span id="rTitle"></span> <span class="pill" id="rMode"></span></h2>
      <div class="links">
        <div>👉 <b>學員連結</b>（給學員 / QR）：<br><a id="studentLink" target="_blank"></a> <button class="btn ghost small" data-copy="studentLink">複製</button></div>
        <div>📺 <b>投影牆</b>（投大螢幕）：<br><a id="wallLink" target="_blank"></a> <button class="btn ghost small" data-copy="wallLink">複製</button></div>
        <div>📌 <b>角落即時（常駐小視窗）</b>：<br><a id="tickLink" target="_blank"></a> <button class="btn ghost small" data-copy="tickLink">複製</button></div>
        <div>🎬 <b>OBS 透明疊加</b>（browser source）：<br><a id="obsLink" target="_blank"></a> <button class="btn ghost small" data-copy="obsLink">複製</button></div>
      </div>
      <div class="qrbox"><div id="qrcode"></div><div class="muted">學員掃這個 QR 即可加入</div></div>
      <p class="muted">⚠️ 管理權限存在你這台瀏覽器裡，下次回來此頁就能管理。</p>
    </div>

    <div class="card">
      <h2>我建立過的場次</h2>
      <div id="savedList"><span class="muted">尚無紀錄</span></div>
    </div>

    <div id="manage" class="card hide">
      <h2>管理：<span id="mTitle"></span> <span class="pill" id="mCount">0</span></h2>
      <div style="margin:6px 0 4px; display:flex; gap:8px; flex-wrap:wrap">
        <button class="btn ghost small" id="renameBtn">✏️ 改名稱</button>
        <button class="btn ghost small" id="exportBtn">⬇ 匯出 CSV 名單</button>
      </div>
      <div class="tablewrap"><table><thead><tr><th>#</th><th>名字</th><th>內容</th><th id="thExtra"></th><th>時間</th><th></th></tr></thead><tbody id="mBody"></tbody></table></div>
    </div>
  </div>

  <script>
    const KEY = "checkin-wall-sessions";
    const base = location.origin;
    let manageTimer = null;
    const MODE_NAME = { checkin: "簽到", message: "留言", qa: "Q&A" };

    // 模式切換 UI
    document.querySelectorAll('#modes label').forEach(l => l.onclick = () => {
      document.querySelectorAll('#modes label').forEach(x => x.classList.remove('on'));
      l.classList.add('on'); l.querySelector('input').checked = true;
      const m = l.dataset.mode;
      document.getElementById('optAnon').classList.toggle('hide', m === 'checkin');
      document.getElementById('optEmoji').classList.toggle('hide', m !== 'message');
    });

    function getSaved() { try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch { return []; } }
    function saveSession(s) { const list = getSaved().filter(x => x.slug !== s.slug); list.unshift(s); localStorage.setItem(KEY, JSON.stringify(list)); }

    document.getElementById("create").onclick = async () => {
      const title = document.getElementById("title").value.trim();
      const code = document.getElementById("code").value.trim();
      const mode = document.querySelector('input[name=mode]:checked').value;
      const allowAnonymous = document.getElementById("allowAnonymous").checked;
      const allowEmoji = document.getElementById("allowEmoji").checked;
      const err = document.getElementById("createErr"); err.textContent = "";
      if (!title) { err.textContent = "請填寫名稱"; return; }
      try {
        const res = await fetch("/api/session", { method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ title, code, mode, allowAnonymous, allowEmoji }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "建立失敗");
        saveSession(data); showResult(data); renderSaved(); openManage(data);
      } catch (e) { err.textContent = e.message; }
    };

    function showResult(s) {
      const studentUrl = `${base}/s/${s.slug}`, wallUrl = `${base}/wall/${s.slug}`, tickUrl = `${base}/ticker/${s.slug}`, obsUrl = `${base}/ticker/${s.slug}?transparent=1`;
      document.getElementById("rTitle").textContent = s.title;
      document.getElementById("rMode").textContent = MODE_NAME[s.mode];
      setLink("studentLink", studentUrl); setLink("wallLink", wallUrl); setLink("tickLink", tickUrl); setLink("obsLink", obsUrl);
      const qr = document.getElementById("qrcode"); qr.innerHTML = "";
      if (window.QRCode) new QRCode(qr, { text: studentUrl, width: 190, height: 190, colorDark: "#1c1b16" });
      document.getElementById("result").classList.remove("hide");
    }
    function setLink(id, url) { const a = document.getElementById(id); a.href = url; a.textContent = url; }

    document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => {
      navigator.clipboard.writeText(document.getElementById(b.dataset.copy).textContent);
      const t = b.textContent; b.textContent = "已複製!"; setTimeout(() => b.textContent = t, 1200);
    });

    function renderSaved() {
      const list = getSaved(); const el = document.getElementById("savedList");
      if (!list.length) { el.innerHTML = `<span class="muted">尚無紀錄</span>`; return; }
      el.innerHTML = list.map(s => `
        <div class="saved-item">
          <div><a href="/wall/${s.slug}" target="_blank">${escapeHtml(s.title)}</a> <span class="muted">${MODE_NAME[s.mode]||""} · /s/${escapeHtml(s.slug)}</span></div>
          <div class="rowbtns">
            <button class="btn ghost small" onclick='manageBy("${s.slug}")'>管理</button>
            <button class="btn ghost small" onclick='reshow("${s.slug}")'>連結/QR</button>
            <button class="btn ghost small" onclick='rename("${s.slug}")'>改名稱</button>
            <button class="btn ghost small danger" onclick='delSession("${s.slug}")'>刪除</button>
          </div>
        </div>`).join("");
    }

    window.delSession = async (slug) => {
      const s = getSaved().find(x => x.slug === slug); if (!s) return;
      if (!confirm(`確定要刪除「${s.title}」嗎？\n\n這會一併清除這個場次底下所有簽到／留言，且無法復原。`)) return;
      try {
        const res = await fetch("/api/session", { method: "DELETE", headers: { "content-type": "application/json" },
          body: JSON.stringify({ slug, adminToken: s.adminToken }) });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "刪除失敗");
      } catch (e) {
        // 後端找不到（可能已被刪）也讓它從清單移除，不擋使用者
        if (!String(e.message).includes("找不到")) { alert(e.message); return; }
      }
      const list = getSaved().filter(x => x.slug !== slug);
      localStorage.setItem(KEY, JSON.stringify(list));
      const mgr = document.getElementById("manage");
      if (mgr && !mgr.classList.contains("hide")) mgr.classList.add("hide");
      renderSaved();
    };
    window.reshow = (slug) => { const s = getSaved().find(x => x.slug === slug); if (s) { showResult(s); window.scrollTo({top:0,behavior:"smooth"}); } };
    window.manageBy = (slug) => { const s = getSaved().find(x => x.slug === slug); if (s) openManage(s); };

    window.rename = async (slug) => {
      const s = getSaved().find(x => x.slug === slug); if (!s) return;
      const input = prompt("輸入新的場次名稱：", s.title);
      if (input === null) return;
      const title = input.trim(); if (!title) return;
      try {
        const res = await fetch("/api/session", { method: "PUT", headers: { "content-type": "application/json" },
          body: JSON.stringify({ slug, adminToken: s.adminToken, title }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "改名失敗");
        s.title = title; saveSession(s); renderSaved();
        const mt = document.getElementById("mTitle"); if (mt) mt.textContent = title;
        const rt = document.getElementById("rTitle"); if (rt) rt.textContent = title;
      } catch (e) { alert(e.message); }
    };

    function openManage(s) {
      document.getElementById("mTitle").textContent = s.title;
      document.getElementById("thExtra").textContent = s.mode === "qa" ? "❤️ / 已回答" : s.mode === "message" ? "❤️" : "";
      document.getElementById("renameBtn").onclick = () => rename(s.slug);
      document.getElementById("exportBtn").onclick = () => exportCsv(s);
      document.getElementById("manage").classList.remove("hide");
      document.getElementById("manage").scrollIntoView({ behavior: "smooth" });
      if (manageTimer) clearInterval(manageTimer);
      const tick = () => loadManage(s); tick(); manageTimer = setInterval(tick, 3000);
    }

    // 權杖走標頭不走網址：網址會被記進瀏覽器歷史與伺服器日誌
    async function exportCsv(s) {
      try {
        const res = await fetch(`/api/export?slug=${encodeURIComponent(s.slug)}`, { headers: { "x-admin-token": s.adminToken } });
        if (!res.ok) throw new Error(await res.text() || "匯出失敗");
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `checkin-${s.slug}-${new Date().toISOString().slice(0,10)}.csv`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) { alert(e.message); }
    }

    async function loadManage(s) {
      try {
        const data = await (await fetch(`/api/list?slug=${encodeURIComponent(s.slug)}`)).json();
        document.getElementById("mCount").textContent = data.count + (s.mode==="checkin"?" 人":" 則");
        let rows = data.entries.slice();
        if (s.mode === "qa") rows.sort((a,b) => (b.votes||0)-(a.votes||0) || b.at-a.at); else rows.reverse();
        document.getElementById("mBody").innerHTML = rows.map((e, i) => `
          <tr>
            <td>${i+1}</td>
            <td>${escapeHtml(e.name)}</td>
            <td>${escapeHtml(e.message || "")} ${e.emoji||""}</td>
            <td>${s.mode==="qa" ? `❤️${e.votes||0} ${e.answered?'<span class="answered">已回答</span>':''}` : (s.mode==="message" ? `❤️${e.votes||0}` : "")}</td>
            <td class="muted">${new Date(e.at).toLocaleTimeString("zh-TW")}</td>
            <td><div class="rowbtns">
              ${s.mode==="qa" ? `<button class="btn ghost small" onclick='toggleAns("${s.slug}","${e.id}",${e.answered?"false":"true"})'>${e.answered?"設未回答":"標已回答"}</button>` : ""}
              <button class="btn ghost small" onclick='del("${s.slug}","${e.id}")'>刪除</button>
            </div></td>
          </tr>`).join("") || `<tr><td colspan="6" class="muted">還沒有資料</td></tr>`;
      } catch {}
    }

    window.toggleAns = async (slug, id, answered) => {
      const s = getSaved().find(x => x.slug === slug); if (!s) return;
      await fetch("/api/answer", { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ slug, id, adminToken: s.adminToken, answered }) });
      loadManage(s);
    };
    window.del = async (slug, id) => {
      const s = getSaved().find(x => x.slug === slug); if (!s) return;
      if (!confirm("確定刪除這筆？")) return;
      await fetch("/api/remove", { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ slug, id, adminToken: s.adminToken }) });
      loadManage(s);
    };

    function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

    // 即時預覽：把輸入清成跟後端一致的代碼，讓老師打字就看到實際結果
    function slugify(v){ return String(v||"").trim().toLowerCase()
      .replace(/[^a-z0-9-]/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"").slice(0,24).replace(/-$/,""); }
    (function(){
      const input = document.getElementById("code"), hint = document.getElementById("codeHint");
      if (!input || !hint) return;
      const upd = () => {
        const raw = input.value.trim();
        if (!raw) { hint.innerHTML = "留空 → 系統會自動產生一組代碼"; return; }
        const slug = slugify(raw);
        if (!slug) { hint.innerHTML = "這組代碼<b>全部是中文／符號，會被略過</b>，改成系統自動產生。建議用英數,如 ai-0613"; return; }
        const tail = `<span class="muted">-xxxxxx</span>`;
        hint.innerHTML = slug === raw.toLowerCase()
          ? `學員連結將是 <b>/s/${escapeHtml(slug)}</b>${tail}`
          : `會自動整理成 <b>/s/${escapeHtml(slug)}</b>${tail}(中文／空格已略過)`;
      };
      input.addEventListener("input", upd); upd();
    })();

    renderSaved();
  </script>
</body>
</html>
