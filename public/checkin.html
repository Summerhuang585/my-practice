<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>簽到牆</title>
  <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@04f46c6a/qrcode.min.js"></script>
  <style>
    :root {
      --blue: #144EA0; --pink: #CF98AE; --nylon: #131610;
      --bg: #e9e7e1; --paper: #ffffff; --line: #dcdad3;
      --ink: #131610; --muted: #7c7a72;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
      font-family: system-ui, "PingFang TC", "Microsoft JhengHei", sans-serif; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 28px 18px 50px; }
    header { text-align: center; margin-bottom: 22px; }
    .live { display: inline-block; background: var(--blue); color: #fff; font-size: 11px; font-weight: 800;
      letter-spacing: 1.5px; padding: 4px 10px; border-radius: 6px; margin-bottom: 10px; }
    .live::before { content: "● "; font-size: 9px; vertical-align: middle; }
    h1 { margin: 0; font-size: 30px; font-weight: 900; letter-spacing: 1px; }
    .sub { color: var(--muted); font-size: 14px; margin-top: 6px; }

    .qrcard { display: flex; gap: 16px; align-items: center; background: var(--paper);
      border: 2px solid var(--blue); border-radius: 14px; padding: 14px 16px; margin-bottom: 16px; }
    .qrcard #qrcode { flex: 0 0 auto; }
    .qrcard #qrcode img, .qrcard #qrcode canvas { display: block; border-radius: 6px; }
    .qrcard .qtext b { display: block; font-size: 15px; margin-bottom: 3px; }
    .qrcard .qtext span { font-size: 13px; color: var(--muted); }

    form { background: var(--paper); border: 2px solid var(--blue); border-radius: 14px; padding: 14px 16px; margin-bottom: 18px; }
    input, textarea { width: 100%; padding: 11px 16px; border: 1.5px solid var(--line); border-radius: 999px;
      font-size: 15px; font-family: inherit; outline: none; background: #fff; color: var(--ink); }
    input:focus, textarea:focus { border-color: var(--blue); }
    textarea { border-radius: 16px; resize: none; min-height: 44px; }
    .field { margin-bottom: 10px; }
    .emojis { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 2px 12px; }
    .emojis button { font-size: 18px; background: #fff; border: 1.5px solid var(--line); border-radius: 10px;
      width: 38px; height: 38px; cursor: pointer; padding: 0; line-height: 1; }
    .emojis button.on { border-color: var(--pink); background: #fbeef4; }
    .send-row { display: flex; justify-content: flex-end; }
    .send { background: var(--blue); color: #fff; border: 0; border-radius: 999px; padding: 11px 30px;
      font-size: 16px; font-weight: 800; cursor: pointer; }
    .send:disabled { opacity: .6; }
    .err { color: #c0392b; font-size: 13px; margin-top: 6px; text-align: right; }

    .count { text-align: center; color: var(--muted); font-size: 13px; margin: 4px 0 16px; }
    .count b { color: var(--blue); }

    .feed { display: flex; flex-direction: column; gap: 12px; }
    .item { background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px;
      animation: pop .4s ease; }
    .item.new { box-shadow: 0 0 0 2px var(--blue); }
    @keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .item .head { display: flex; align-items: center; gap: 8px; }
    .avatar { width: 22px; height: 22px; border-radius: 50%; color: #fff; font-size: 12px; font-weight: 800;
      display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
    .item .name { font-weight: 800; font-size: 15px; }
    .item .time { margin-left: auto; color: var(--muted); font-size: 12px; }
    .item .message { margin: 8px 0 0; font-size: 15px; line-height: 1.6; word-break: break-word; white-space: pre-wrap; }
    .item .emoji { font-size: 20px; margin-top: 8px; }

    footer { text-align: center; color: var(--muted); font-size: 11px; letter-spacing: 3px; margin-top: 36px; }
    .center-msg { text-align: center; color: var(--muted); padding: 30px 0; }
  </style>
</head>
<body>
  <div class="wrap" id="app"><div class="center-msg">載入中…</div></div>

  <script>
    const slug = decodeURIComponent((location.pathname.split("/s/")[1] || "")).replace(/\/+$/,"");
    const app = document.getElementById("app");
    const EMOJIS = ["👋","👍","🎉","🔥","✏️","❤️","😀","🙌"];
    // 只用你的三個品牌色：SAVVY 藍 / FUNNY WEATHER 粉 / NYLON 近黑
    const PALETTE = [
      { bg: "#144EA0", fg: "#144EA0" },
      { bg: "#CF98AE", fg: "#a85f80" },
      { bg: "#131610", fg: "#131610" },
    ];
    const seen = new Set();
    let chosenEmoji = "👋";

    async function init() {
      if (!slug) { app.innerHTML = `<div class="center-msg">網址缺少課程代碼</div>`; return; }
      try {
        const res = await fetch(`/api/session?slug=${encodeURIComponent(slug)}`);
        if (!res.ok) throw new Error((await res.json()).error || "找不到場次");
        render(await res.json());
      } catch (e) { app.innerHTML = `<div class="center-msg">😵 ${escapeHtml(e.message)}</div>`; }
    }

    function render(s) {
      document.title = s.title + " · 簽到牆";
      app.innerHTML = `
        <header>
          <div class="live">LIVE</div>
          <h1>${escapeHtml(s.title)}</h1>
          <div class="sub">留下你的名字${s.allowMessage ? "和一句話" : ""}，跟大家打個招呼吧</div>
        </header>

        <div class="qrcard">
          <div id="qrcode"></div>
          <div class="qtext"><b>歡迎加入留言牆</b><span>用手機掃描 QR code，即可在自己的裝置上留言。</span></div>
        </div>

        <form id="form">
          <div class="field"><input id="name" maxlength="40" placeholder="你的名字" autocomplete="name" /></div>
          ${s.allowMessage ? `<div class="field"><textarea id="message" maxlength="200" placeholder="說一句話…"></textarea></div>
          <div class="emojis" id="emojis"></div>` : ``}
          <div class="send-row"><button class="send" id="send" type="submit">送出</button></div>
          <div class="err" id="err"></div>
        </form>

        <div class="count">目前 <b id="count">0</b> 則留言</div>
        <div class="feed" id="feed"></div>
        <footer>✦ ✦ ✦ CHECK·IN WALL</footer>
      `;

      if (window.QRCode) new QRCode(document.getElementById("qrcode"), { text: location.href, width: 84, height: 84, colorDark: "#131610" });

      if (s.allowMessage) {
        const box = document.getElementById("emojis");
        box.innerHTML = EMOJIS.map(e => `<button type="button" data-e="${e}" class="${e===chosenEmoji?"on":""}">${e}</button>`).join("");
        box.querySelectorAll("button").forEach(b => b.onclick = () => {
          chosenEmoji = b.dataset.e;
          box.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
        });
      }

      const form = document.getElementById("form");
      const nameEl = document.getElementById("name");
      const msgEl = document.getElementById("message");
      form.onsubmit = async (ev) => {
        ev.preventDefault();
        const name = nameEl.value.trim();
        const err = document.getElementById("err");
        const btn = document.getElementById("send");
        err.textContent = "";
        if (!name) { err.textContent = "請輸入名字"; nameEl.focus(); return; }
        btn.disabled = true;
        try {
          const res = await fetch("/api/checkin", { method: "POST", headers: { "content-type": "application/json" },
            body: JSON.stringify({ slug, name, message: msgEl ? msgEl.value.trim() : "", emoji: s.allowMessage ? chosenEmoji : "" }) });
          if (!res.ok) throw new Error((await res.json()).error || "送出失敗");
          if (msgEl) msgEl.value = "";
          nameEl.value = "";
          refresh();
        } catch (e) { err.textContent = e.message; }
        finally { btn.disabled = false; }
      };

      nameEl.focus();
      refresh();
      setInterval(refresh, 2500);
    }

    async function refresh() {
      try {
        const res = await fetch(`/api/list?slug=${encodeURIComponent(slug)}`);
        const data = await res.json();
        const countEl = document.getElementById("count");
        if (countEl) countEl.textContent = data.count;
        const feed = document.getElementById("feed");
        if (!feed) return;
        const firstLoad = seen.size === 0;
        const items = data.entries.slice().reverse(); // 最新在上
        feed.innerHTML = items.map(e => {
          const isNew = !seen.has(e.id); seen.add(e.id);
          const c = PALETTE[hash(e.name) % PALETTE.length];
          const ch = (e.name[0] || "?").toUpperCase();
          return `<div class="item ${isNew && !firstLoad ? "new" : ""}">
            <div class="head">
              <span class="avatar" style="background:${c.bg}">${escapeHtml(ch)}</span>
              <span class="name" style="color:${c.fg}">${escapeHtml(e.name)}</span>
              <span class="time">${fmtTime(e.at)}</span>
            </div>
            ${e.message ? `<div class="message">${escapeHtml(e.message)}</div>` : ""}
            ${e.emoji ? `<div class="emoji">${e.emoji}</div>` : ""}
          </div>`;
        }).join("") || `<div class="center-msg">還沒有人留言，當第一個吧 👋</div>`;
      } catch {}
    }

    function fmtTime(ms){ return new Date(ms).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"}); }
    function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
    function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

    init();
  </script>
</body>
</html>
