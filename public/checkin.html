<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>簽到牆</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,500&family=Noto+Serif+TC:wght@400;600;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/brand.css">
  <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@04f46c6a/qrcode.min.js"></script>
  <style>
    .wrap { max-width: 620px; margin: 0 auto; padding: 26px 22px 60px; }
    .qr { display: flex; gap: 16px; align-items: center; padding: 16px 0; }
    .qr #qrcode { flex: 0 0 auto; border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); padding: 6px; background: #fff; }
    .qr .lab { font-family: var(--mono); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--coral); margin-bottom: 6px; }
    .qr .txt { font-size: 15px; color: var(--muted); line-height: 1.5; }
    .send-row { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; gap: 12px; }
    .modetag { color: var(--coral); }
  </style>
</head>
<body>
  <div class="wrap" id="app"><div class="center-msg">載入中…</div></div>

  <script>
    const slug = decodeURIComponent((location.pathname.split("/s/")[1] || "")).replace(/\/+$/,"");
    const app = document.getElementById("app");
    const EMOJIS = ["👋","👍","🎉","🔥","✏️","❤️","😀","🙌"];
    const ACCENT = ["#c0543d", "#cf98ae", "#7f8a6f"];
    const seen = new Set();
    let chosenEmoji = "👋";
    let SESSION = null;
    const clientId = getClientId();

    function getClientId() {
      let v = localStorage.getItem("cw-client");
      if (!v) { v = crypto.randomUUID(); localStorage.setItem("cw-client", v); }
      return v;
    }
    const MODE_LABEL = { checkin: "簽到 Check-in", message: "留言 Message", qa: "提問 Q&A" };

    async function init() {
      if (!slug) { app.innerHTML = `<div class="center-msg">網址缺少課程代碼</div>`; return; }
      try {
        const res = await fetch(`/api/session?slug=${encodeURIComponent(slug)}`);
        if (!res.ok) throw new Error((await res.json()).error || "找不到場次");
        SESSION = await res.json();
        render();
      } catch (e) { app.innerHTML = `<div class="center-msg">😵 ${escapeHtml(e.message)}</div>`; }
    }

    function render() {
      const s = SESSION;
      document.title = s.title + " · " + MODE_LABEL[s.mode];
      const today = new Date().toLocaleDateString("en-US", { month: "short", day: "2-digit", year: "numeric" }).toUpperCase();
      const dek = s.mode === "checkin" ? "輸入你的名字完成簽到。"
        : s.mode === "qa" ? "把想問的問題貼上來，也幫想問的問題按個讚。"
        : "留下你的名字與一句話，跟大家打個招呼。";
      const namePh = s.allowAnonymous ? "你的名字（可留空 = 匿名）" : "你的名字";
      const hasText = s.mode !== "checkin";
      const textLabel = s.mode === "qa" ? "你的問題 / Question" : "一句話 / Note";
      const textPh = s.mode === "qa" ? "想問的問題…" : "想說的話…";
      const btnLabel = s.mode === "checkin" ? "簽到 Check in →" : s.mode === "qa" ? "送出問題 →" : "送出 Send →";

      app.innerHTML = `
        <div class="rule"></div>
        <div class="kicker"><span class="live">LIVE · <span class="modetag">${MODE_LABEL[s.mode]}</span></span><span>CHECK·IN WALL — ${today}</span></div>
        <div class="rule thin"></div>
        <h1 class="h-title">${escapeHtml(s.title)}</h1>
        <div class="dek">${dek}</div>
        <div class="rule thin"></div>
        <div class="qr">
          <div id="qrcode"></div>
          <div><div class="lab">Scan to join · 掃描加入</div><div class="txt">用手機掃描，在自己的裝置上${s.mode==="qa"?"提問":s.mode==="checkin"?"簽到":"留言"}。</div></div>
        </div>
        <div class="rule thin"></div>
        <form id="form">
          <label class="flabel" for="name">${s.allowAnonymous ? "名字（選填）" : "你的名字 / Name"}</label>
          <div class="field"><input id="name" maxlength="40" placeholder="${namePh}" autocomplete="name" /></div>
          ${hasText ? `<label class="flabel" for="message">${textLabel}</label><div class="field"><textarea id="message" maxlength="280" placeholder="${textPh}"></textarea></div>` : ``}
          ${s.allowEmoji ? `<label class="flabel">心情</label><div class="emojis" id="emojis"></div>` : ``}
          <div class="send-row"><span class="err" id="err"></span><button class="btn" id="send" type="submit">${btnLabel}</button></div>
        </form>
        <div class="count"><span>${s.mode==="qa"?"問題 Questions":s.mode==="checkin"?"簽到 Check-ins":"留言 Entries"}</span><span class="ln"></span><b id="count">00</b></div>
        <div class="feed" id="feed"></div>
        <footer>✦ Summer's Lab ✦</footer>
      `;

      if (window.QRCode) new QRCode(document.getElementById("qrcode"), { text: location.href, width: 80, height: 80, colorDark: "#1c1b16", colorLight: "#ffffff" });

      if (s.allowEmoji) {
        const box = document.getElementById("emojis");
        box.innerHTML = EMOJIS.map(e => `<button type="button" data-e="${e}" class="${e===chosenEmoji?"on":""}">${e}</button>`).join("");
        box.querySelectorAll("button").forEach(b => b.onclick = () => {
          chosenEmoji = b.dataset.e;
          box.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
        });
      }

      const form = document.getElementById("form");
      const nameEl = document.getElementById("name");
      const msgEl = document.getElementById("message");
      form.onsubmit = async (ev) => {
        ev.preventDefault();
        const err = document.getElementById("err");
        const btn = document.getElementById("send");
        err.textContent = "";
        const name = nameEl.value.trim();
        if (!name && !s.allowAnonymous) { err.textContent = "請輸入名字"; nameEl.focus(); return; }
        if (hasText && msgEl && !msgEl.value.trim()) { err.textContent = s.mode==="qa"?"請輸入問題":"請輸入內容"; msgEl.focus(); return; }
        btn.disabled = true;
        try {
          const res = await fetch("/api/checkin", { method: "POST", headers: { "content-type": "application/json" },
            body: JSON.stringify({ slug, name, message: msgEl ? msgEl.value.trim() : "", emoji: s.allowEmoji ? chosenEmoji : "" }) });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "送出失敗");
          if (msgEl) msgEl.value = "";
          if (s.mode === "checkin") { nameEl.value = ""; err.innerHTML = `<span style="color:var(--sage)">簽到成功 ✅</span>`; }
          refresh();
        } catch (e) { err.textContent = e.message; }
        finally { btn.disabled = false; }
      };

      nameEl.focus();
      refresh();
      setInterval(refresh, 2500);
    }

    async function refresh() {
      try {
        const res = await fetch(`/api/list?slug=${encodeURIComponent(slug)}`);
        const data = await res.json();
        const c = document.getElementById("count"); if (c) c.textContent = String(data.count).padStart(2, "0");
        const feed = document.getElementById("feed"); if (!feed) return;
        const firstLoad = seen.size === 0;
        let items = data.entries.slice();
        if (SESSION.mode === "qa") items.sort((a,b) => (b.votes||0)-(a.votes||0) || b.at-a.at);
        else items.reverse();
        const total = items.length;
        feed.innerHTML = items.map((e, i) => {
          const isNew = !seen.has(e.id); seen.add(e.id);
          const no = String(SESSION.mode==="qa" ? i+1 : total - i).padStart(2, "0");
          const color = ACCENT[i % ACCENT.length];
          const voted = Array.isArray(e.voters) && e.voters.includes(clientId);
          return `<div class="entry ${isNew && !firstLoad ? "flash" : ""}">
            <div class="no" style="color:${color}">${no}</div>
            <div>
              <div class="meta"><span class="name" style="color:${color}">${escapeHtml(e.name)}</span>
                ${SESSION.mode==="qa" && e.answered ? `<span class="answered">已回答</span>` : ``}
                <span class="time">${fmtTime(e.at)}</span></div>
              ${e.message ? `<div class="msg">${escapeHtml(e.message)}</div>` : ""}
              ${e.emoji ? `<div class="emoji">${e.emoji}</div>` : ""}
              ${SESSION.mode==="qa" ? `<button class="vote ${voted?"on":""}" data-id="${e.id}">👍 <b>${e.votes||0}</b></button>` : ""}
            </div>
          </div>`;
        }).join("") || mascotEmpty(SESSION.mode==="qa"?"還沒有問題，當第一個提問者！":SESSION.mode==="checkin"?"還沒有人簽到，當第一個吧！":"還沒有人留言，先說聲哈囉！");

        if (SESSION.mode === "qa") feed.querySelectorAll(".vote").forEach(b => b.onclick = () => doVote(b.dataset.id));
      } catch {}
    }

    async function doVote(id) {
      try {
        await fetch("/api/vote", { method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ slug, id, clientId }) });
        refresh();
      } catch {}
    }

    function mascotEmpty(text){ return `<div class="mascot-box"><img src="/mascot.svg" alt=""><div class="bubble">${escapeHtml(text)}</div></div>`; }
    function fmtTime(ms){ return new Date(ms).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"}); }
    function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

    init();
  </script>
</body>
</html>
