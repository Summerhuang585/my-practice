<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>簽到牆</title>
  <style>
    :root {
      --blue: #144EA0; --pink: #CF98AE; --nylon: #131610;
      --paper: #fbfaf7; --line: #e4e2db; --ink: #131610;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--nylon); color: #fff;
      font-family: system-ui, "PingFang TC", "Microsoft JhengHei", sans-serif; padding: 24px 30px; }
    header { text-align: center; margin-bottom: 22px; }
    .live { display: inline-block; background: var(--blue); color: #fff; font-size: 13px; font-weight: 800;
      letter-spacing: 1.5px; padding: 4px 12px; border-radius: 7px; }
    .live::before { content: "● "; font-size: 10px; }
    h1 { margin: 10px 0 4px; font-size: clamp(28px, 4vw, 52px); font-weight: 900; letter-spacing: 1px; }
    .count { color: #b9b6ad; font-size: clamp(15px, 1.6vw, 22px); }
    .count b { color: var(--pink); font-size: 1.3em; }

    .feed { column-width: 280px; column-gap: 16px; }
    .item { break-inside: avoid; background: var(--paper); color: var(--ink); border: 1.5px solid var(--line);
      border-radius: 14px; padding: 16px 18px; margin-bottom: 16px; animation: pop .45s ease; }
    .item.new { box-shadow: 0 0 0 2px var(--blue), 0 8px 26px rgba(20,78,160,.5); }
    @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
    .head { display: flex; align-items: center; gap: 9px; }
    .avatar { width: 28px; height: 28px; border-radius: 50%; color: #fff; font-size: 14px; font-weight: 800;
      display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
    .name { font-weight: 800; font-size: 18px; }
    .time { margin-left: auto; color: #9b988f; font-size: 13px; }
    .message { margin-top: 9px; font-size: 17px; line-height: 1.6; word-break: break-word; white-space: pre-wrap; }
    .emoji { font-size: 24px; margin-top: 8px; }
    .empty { text-align: center; margin-top: 16vh; color: #b9b6ad; }
    .empty .big { font-size: 64px; }
    .hint { position: fixed; bottom: 10px; right: 16px; color: #6f6c64; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <div class="live">LIVE</div>
    <h1 id="title">簽到牆</h1>
    <div class="count">目前 <b id="count">0</b> 則留言</div>
  </header>
  <div id="feed" class="feed"></div>
  <div class="hint">每 2 秒自動更新 · 按 F11 全螢幕投影</div>

  <script>
    const slug = decodeURIComponent((location.pathname.split("/wall/")[1] || "")).replace(/\/+$/,"");
    const feed = document.getElementById("feed");
    const seen = new Set();
    const PALETTE = [
      { bg: "#144EA0", fg: "#144EA0" },
      { bg: "#CF98AE", fg: "#a85f80" },
      { bg: "#131610", fg: "#131610" },
    ];

    async function loadTitle() {
      try { const r = await fetch(`/api/session?slug=${encodeURIComponent(slug)}`);
        if (r.ok) { const s = await r.json(); document.getElementById("title").textContent = s.title; document.title = s.title + " · 簽到牆"; } } catch {}
    }

    async function refresh() {
      try {
        const data = await (await fetch(`/api/list?slug=${encodeURIComponent(slug)}`)).json();
        document.getElementById("count").textContent = data.count;
        if (data.count === 0) { feed.innerHTML = `<div class="empty"><div class="big">👋</div><div>等待第一位簽到…</div></div>`; return; }
        const firstLoad = seen.size === 0;
        feed.innerHTML = data.entries.slice().reverse().map(e => {
          const isNew = !seen.has(e.id); seen.add(e.id);
          const c = PALETTE[hash(e.name) % PALETTE.length];
          const ch = (e.name[0] || "?").toUpperCase();
          return `<div class="item ${isNew && !firstLoad ? "new" : ""}">
            <div class="head"><span class="avatar" style="background:${c.bg}">${escapeHtml(ch)}</span>
              <span class="name" style="color:${c.fg}">${escapeHtml(e.name)}</span>
              <span class="time">${fmtTime(e.at)}</span></div>
            ${e.message ? `<div class="message">${escapeHtml(e.message)}</div>` : ""}
            ${e.emoji ? `<div class="emoji">${e.emoji}</div>` : ""}
          </div>`;
        }).join("");
      } catch {}
    }

    function fmtTime(ms){ return new Date(ms).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"}); }
    function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
    function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

    if (!slug) feed.innerHTML = `<div class="empty">網址缺少課程代碼</div>`;
    else { loadTitle(); refresh(); setInterval(refresh, 2000); }
  </script>
</body>
</html>
