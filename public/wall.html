<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>簽到牆</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,500&family=Noto+Serif+TC:wght@400;600;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/brand.css">
  <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@04f46c6a/qrcode.min.js"></script>
  <style>
    body { padding: 30px 44px 40px; }
    .masthead { border-top: 2px solid var(--ink); border-bottom: 1px solid var(--ink); padding: 8px 0 0; margin-bottom: 6px; }
    .masthead .kicker { font-size: 13px; letter-spacing: 3px; }
    h1 { font-family: var(--display); font-weight: 900; font-size: clamp(40px, 7vw, 90px); line-height: .95;
      letter-spacing: -1px; margin: 6px 0 10px; text-align: center; }
    .subbar { display: flex; justify-content: center; gap: 16px; align-items: baseline; border-top: 1px solid var(--ink);
      padding: 8px 0; font-family: var(--mono); font-size: 14px; letter-spacing: 2px; text-transform: uppercase; }
    .subbar b { font-family: var(--display); font-size: 22px; color: var(--coral); }
    .feed { column-width: 320px; column-gap: 40px; margin-top: 22px; }
    .feed .entry { break-inside: avoid; }
    .feed .entry .no { font-size: 30px; }
    .feed .entry .name { font-size: 15px; }
    .feed .entry .msg { font-size: 20px; }
    .votes-badge { display:inline-flex; align-items:center; gap:5px; font-family: var(--mono); font-size: 14px; color: var(--coral); margin-top: 8px; }
    .hint { position: fixed; bottom: 10px; left: 18px; font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 1px; }
    /* 右下角常駐 QR（有人簽到後顯示） */
    .joinqr { position: fixed; right: 22px; bottom: 22px; background: #fff; border: 3px solid var(--ink);
      box-shadow: 5px 5px 0 var(--ink); padding: 10px 10px 8px; display: none; flex-direction: column; align-items: center; gap: 6px; z-index: 20; }
    .joinqr-cap { font-family: var(--mono); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink); text-align: center; line-height: 1.3; }
    .joinqr-cap span { color: var(--muted); }
    #cornerqr { display: flex; justify-content: center; }
    .joinqr img, .joinqr canvas { display: block; }
    /* 開場大 QR（還沒人簽到時置中顯示） */
    .empty-join { display: flex; flex-direction: column; align-items: center; gap: 16px; margin-top: 3vh; }
    .empty-mascot { width: 80px; height: auto; animation: dash .7s steps(4,end) infinite; transform-origin: bottom center; }
    .bigqr-card { background: #fff; border: 3px solid var(--ink); box-shadow: 7px 7px 0 var(--ink); padding: 20px 20px 16px; text-align: center; }
    .bigqr-card #bigqr { display: flex; justify-content: center; }
    .bigqr-card img, .bigqr-card canvas { display: block; margin: 0 auto; }
    .bigqr-cap { font-family: var(--mono); font-size: 15px; letter-spacing: 2px; text-transform: uppercase; color: var(--coral); margin-top: 12px; }
    .bigqr-url { font-family: var(--mono); font-size: 14px; color: var(--muted); margin-top: 5px; }
  </style>
</head>
<body>
  <div class="masthead">
    <div class="kicker"><span class="live">LIVE <span id="mode"></span></span><span id="date"></span></div>
    <h1 id="title">CHECK·IN WALL</h1>
    <div class="subbar"><span id="countlabel">Entries</span><b id="count">00</b></div>
  </div>
  <div id="feed" class="feed"></div>
  <div class="joinqr" id="joinqr">
    <div id="cornerqr"></div>
    <div class="joinqr-cap">掃描加入<br><span>Scan to join</span></div>
  </div>
  <div class="hint">每 2 秒自動更新 · F11 全螢幕投影</div>

  <script>
    const slug = decodeURIComponent((location.pathname.split("/wall/")[1] || "")).replace(/\/+$/,"");
    const joinURL = location.origin + "/s/" + slug;
    const joinLabel = location.host + "/s/" + slug;
    const feed = document.getElementById("feed");
    const seen = new Set();
    const ACCENT = ["#c0543d", "#cf98ae", "#7f8a6f"];
    let SESSION = null;
    const MODE_LABEL = { checkin: "· 簽到", message: "· 留言", qa: "· Q&A" };
    const COUNT_LABEL = { checkin: "Check-ins", message: "Entries", qa: "Questions" };
    document.getElementById("date").textContent = "CHECK·IN WALL · " +
      new Date().toLocaleDateString("en-US", { month: "short", day: "2-digit", year: "numeric" }).toUpperCase();

    let ended = false;
    let ticks = 0;

    async function loadSession() {
      try {
        const r = await fetch(`/api/session?slug=${encodeURIComponent(slug)}`);
        if (r.status === 404) { showEnded(); return; }
        if (r.ok) { SESSION = await r.json();
          document.getElementById("title").textContent = SESSION.title;
          document.getElementById("mode").textContent = MODE_LABEL[SESSION.mode] || "";
          document.getElementById("countlabel").textContent = COUNT_LABEL[SESSION.mode] || "Entries";
          document.title = SESSION.title + " · 簽到牆"; } } catch {}
    }

    // 場次被講者刪掉時，牆上原本會顯示成「還沒有人加入」並繼續叫人掃 QR，
    // 掃了才發現場次不存在。改成明講已結束。
    function showEnded() {
      ended = true;
      document.getElementById("joinqr").style.display = "none";
      feed.style.columnWidth = "auto";
      feed.innerHTML = `<div class="empty-join"><div class="bigqr-card"><div class="bigqr-cap">這個場次已結束</div></div></div>`;
    }

    function renderEmptyJoin() {
      document.getElementById("joinqr").style.display = "none"; // 開場改用中央大 QR
      feed.style.columnWidth = "auto"; // 關掉多欄，讓開場區塊置中不被拆欄
      if (feed.dataset.empty === "1") return; // 已經在開場狀態就別重畫，否則 QR 每 2 秒閃一次
      feed.innerHTML = `<div class="empty-join">
        <img class="empty-mascot" src="/mascot.svg" alt="">
        <div class="bigqr-card"><div id="bigqr"></div><div class="bigqr-cap">掃描加入 · Scan to join</div><div class="bigqr-url">${escapeHtml(joinLabel)}</div></div>
      </div>`;
      const bq = document.getElementById("bigqr");
      if (bq && window.QRCode) new QRCode(bq, { text: joinURL, width: 200, height: 200, colorDark: "#1c1b16", colorLight: "#ffffff" });
      feed.dataset.empty = "1";
    }

    async function refresh() {
      if (!SESSION || ended) return;
      // 每 30 秒回頭確認場次還在、標題有沒有被改
      if (++ticks % 15 === 0) await loadSession();
      if (ended) return;
      try {
        const data = await (await fetch(`/api/list?slug=${encodeURIComponent(slug)}`)).json();
        document.getElementById("count").textContent = String(data.count).padStart(2, "0");
        if (data.count === 0) { renderEmptyJoin(); return; }
        feed.dataset.empty = "0";
        document.getElementById("joinqr").style.display = "flex"; // 進行中：右下角常駐 QR
        renderCornerQR();
        feed.style.columnWidth = ""; // 回復多欄名單排版
        const firstLoad = seen.size === 0;
        let items = data.entries.slice();
        if (SESSION.mode === "qa") items.sort((a,b) => (b.votes||0)-(a.votes||0) || b.at-a.at);
        else items.reverse();
        const total = items.length;
        feed.innerHTML = items.map((e, i) => {
          const isNew = !seen.has(e.id); seen.add(e.id);
          const no = String(SESSION.mode==="qa" ? i+1 : total - i).padStart(2, "0");
          const color = ACCENT[i % ACCENT.length];
          return `<div class="entry ${isNew && !firstLoad ? "flash" : ""}">
            <div class="no" style="color:${color}">${no}</div>
            <div>
              <div class="meta"><span class="name" style="color:${color}">${escapeHtml(e.name)}</span>
                ${SESSION.mode==="qa" && e.answered ? `<span class="answered">已回答</span>` : ``}
                <span class="time">${fmtTime(e.at)}</span></div>
              ${e.message ? `<div class="msg">${escapeHtml(e.message)}</div>` : ""}
              ${e.emoji ? `<div class="emoji">${e.emoji}</div>` : ""}
              ${SESSION.mode==="qa" ? `<div class="votes-badge">❤️ ${e.votes||0}</div>` : (SESSION.mode==="message" && (e.votes||0)>0 ? `<div class="votes-badge">❤️ ${e.votes}</div>` : "")}
            </div>
          </div>`;
        }).join("");
      } catch {}
    }

    function renderCornerQR(){
      const box = document.getElementById("cornerqr");
      if (box.dataset.done || !window.QRCode) return;
      new QRCode(box, { text: joinURL, width: 128, height: 128, colorDark: "#1c1b16", colorLight: "#ffffff" });
      box.dataset.done = "1";
    }
    function fmtTime(ms){ return new Date(ms).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"}); }
    function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

    if (!slug) feed.innerHTML = `<div class="center-msg">網址缺少課程代碼</div>`;
    else { loadSession().then(() => { refresh(); setInterval(refresh, 2000); }); }
  </script>
</body>
</html>
