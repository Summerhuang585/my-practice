<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>簽到牆</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,500&family=Noto+Serif+TC:wght@400;600;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/brand.css">
  <style>
    body { padding: 30px 44px 40px; }
    .masthead { border-top: 2px solid var(--ink); border-bottom: 1px solid var(--ink); padding: 8px 0 0; margin-bottom: 6px; }
    .masthead .kicker { font-size: 13px; letter-spacing: 3px; }
    h1 { font-family: var(--display); font-weight: 900; font-size: clamp(40px, 7vw, 90px); line-height: .95;
      letter-spacing: -1px; margin: 6px 0 10px; text-align: center; }
    .subbar { display: flex; justify-content: center; gap: 16px; align-items: baseline; border-top: 1px solid var(--ink);
      padding: 8px 0; font-family: var(--mono); font-size: 14px; letter-spacing: 2px; text-transform: uppercase; }
    .subbar b { font-family: var(--display); font-size: 22px; color: var(--coral); }
    .feed { column-width: 320px; column-gap: 40px; margin-top: 22px; }
    .feed .entry { break-inside: avoid; }
    .feed .entry .no { font-size: 30px; }
    .feed .entry .name { font-size: 15px; }
    .feed .entry .msg { font-size: 20px; }
    .votes-badge { display:inline-flex; align-items:center; gap:5px; font-family: var(--mono); font-size: 14px; color: var(--coral); margin-top: 8px; }
    .hint { position: fixed; bottom: 10px; right: 18px; font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="masthead">
    <div class="kicker"><span class="live">LIVE <span id="mode"></span></span><span id="date"></span></div>
    <h1 id="title">CHECK·IN WALL</h1>
    <div class="subbar"><span id="countlabel">Entries</span><b id="count">00</b></div>
  </div>
  <div id="feed" class="feed"></div>
  <div class="hint">每 2 秒自動更新 · F11 全螢幕投影</div>

  <script>
    const slug = decodeURIComponent((location.pathname.split("/wall/")[1] || "")).replace(/\/+$/,"");
    const feed = document.getElementById("feed");
    const seen = new Set();
    const ACCENT = ["#c0543d", "#cf98ae", "#7f8a6f"];
    let SESSION = null;
    const MODE_LABEL = { checkin: "· 簽到", message: "· 留言", qa: "· Q&A" };
    const COUNT_LABEL = { checkin: "Check-ins", message: "Entries", qa: "Questions" };
    document.getElementById("date").textContent = "CHECK·IN WALL — " +
      new Date().toLocaleDateString("en-US", { month: "short", day: "2-digit", year: "numeric" }).toUpperCase();

    async function loadSession() {
      try { const r = await fetch(`/api/session?slug=${encodeURIComponent(slug)}`);
        if (r.ok) { SESSION = await r.json();
          document.getElementById("title").textContent = SESSION.title;
          document.getElementById("mode").textContent = MODE_LABEL[SESSION.mode] || "";
          document.getElementById("countlabel").textContent = COUNT_LABEL[SESSION.mode] || "Entries";
          document.title = SESSION.title + " · 簽到牆"; } } catch {}
    }

    async function refresh() {
      if (!SESSION) return;
      try {
        const data = await (await fetch(`/api/list?slug=${encodeURIComponent(slug)}`)).json();
        document.getElementById("count").textContent = String(data.count).padStart(2, "0");
        if (data.count === 0) { feed.innerHTML = `<div class="center-msg">等待第一筆…</div>`; return; }
        const firstLoad = seen.size === 0;
        let items = data.entries.slice();
        if (SESSION.mode === "qa") items.sort((a,b) => (b.votes||0)-(a.votes||0) || b.at-a.at);
        else items.reverse();
        const total = items.length;
        feed.innerHTML = items.map((e, i) => {
          const isNew = !seen.has(e.id); seen.add(e.id);
          const no = String(SESSION.mode==="qa" ? i+1 : total - i).padStart(2, "0");
          const color = ACCENT[i % ACCENT.length];
          return `<div class="entry ${isNew && !firstLoad ? "flash" : ""}">
            <div class="no" style="color:${color}">${no}</div>
            <div>
              <div class="meta"><span class="name" style="color:${color}">${escapeHtml(e.name)}</span>
                ${SESSION.mode==="qa" && e.answered ? `<span class="answered">已回答</span>` : ``}
                <span class="time">${fmtTime(e.at)}</span></div>
              ${e.message ? `<div class="msg">${escapeHtml(e.message)}</div>` : ""}
              ${e.emoji ? `<div class="emoji">${e.emoji}</div>` : ""}
              ${SESSION.mode==="qa" ? `<div class="votes-badge">👍 ${e.votes||0}</div>` : ""}
            </div>
          </div>`;
        }).join("");
      } catch {}
    }

    function fmtTime(ms){ return new Date(ms).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"}); }
    function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

    if (!slug) feed.innerHTML = `<div class="center-msg">網址缺少課程代碼</div>`;
    else { loadSession().then(() => { refresh(); setInterval(refresh, 2000); }); }
  </script>
</body>
</html>
