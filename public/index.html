<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>課程簽到牆</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: system-ui, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #131610; color: #f4f3ef; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .box { text-align: center; max-width: 520px; }
    h1 { font-size: 40px; margin: 0 0 10px; }
    p { font-size: 17px; color: #c9c6bd; line-height: 1.7; }
    a.btn { display: inline-block; margin-top: 22px; background: #144EA0; color: #fff; text-decoration: none;
      padding: 14px 28px; border-radius: 12px; font-weight: 800; font-size: 17px; box-shadow: 0 10px 30px rgba(20,78,160,.45); }
    .steps { text-align: left; background: #1d211c; border: 1.5px solid #2c302a; border-radius: 16px; padding: 18px 22px; margin-top: 26px; font-size: 15px; color: #cf98ae; }
    .steps li { margin: 8px 0; }
  </style>
</head>
<body>
  <div class="box">
    <h1>📋 課程簽到牆</h1>
    <p>學員掃 QR Code 或開連結輸入名字即可簽到，<br>名字會即時出現在投影牆上。</p>
    <a class="btn" href="/admin.html">老師：建立簽到場次 →</a>
    <ol class="steps">
      <li>到「老師後台」建立一個場次，取得學員連結與 QR Code</li>
      <li>把 QR Code（或 /s/代碼 連結）給學員</li>
      <li>自己開投影牆 /wall/代碼 投影到大螢幕</li>
      <li>學員簽到，名字即時出現在牆上 🎉</li>
    </ol>
  </div>
</body>
</html>
